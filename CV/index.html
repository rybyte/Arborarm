<html>
    <head>
        <title>Raspberry Pi Robot</title>
        <script>
            // Send commands to the server for motor control
            function sendCommand(direction, action) {
                fetch('/' + direction, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=${action}`
                });
            }
        </script>
    </head>
    <body>
        <h1>Raspberry Pi Robot</h1>
        <h2>Camera Stream</h2>
        <img src="/video_feed" width="640" height="480">
        <h2>Controls</h2>
        <button onclick="sendCommand('stop', 'press')">Stop</button>
    </body>
    </html>
